<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Katalog Perpustakaan - Aesthetic Orange</title>
    <style>
        /* Pengaturan Dasar & Background */
        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            /* Background gradasi krem ke kuning muda agar aesthetic */
            background: linear-gradient(135deg, #fff9e6 0%, #ffecb3 100%);
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            color: #444;
        }

        .container {
            max-width: 900px;
            margin: 40px auto;
            background: rgba(255, 255, 255, 0.95);
            padding: 30px;
            border-radius: 25px;
            box-shadow: 0 10px 30px rgba(255, 165, 0, 0.2); /* Shadow warna oranye tipis */
        }

        /* Bagian Header & Tagline */
        .header-section {
            text-align: center;
            margin-bottom: 30px;
        }

        .header-section h1 {
            /* Warna Oranye Terang */
            color: #fb8c00;
            margin-bottom: 5px;
            font-size: 32px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.05);
        }

        .header-section p {
            color: #f57c00;
            font-style: italic;
            font-weight: 500;
        }

        /* Kotak Pencarian */
        .search-box {
            margin-bottom: 25px;
            display: flex;
            justify-content: center;
        }

        #searchInput {
            width: 80%;
            padding: 12px 25px;
            font-size: 16px;
            border: 2px solid #ffe082;
            border-radius: 30px;
            outline: none;
            transition: 0.3s;
            background-color: #fffdec;
        }

        #searchInput:focus {
            border-color: #fb8c00;
            box-shadow: 0 0 10px rgba(251, 140, 0, 0.2);
        }

        /* Tabel Katalog */
        table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            border-radius: 15px;
            overflow: hidden;
            border: 1px solid #ffe082;
            margin-bottom: 30px;
        }

        thead {
            /* Gradasi Oranye ke Kuning Tua */
            background: linear-gradient(to right, #fb8c00, #ffb300);
            color: white;
        }

        th, td {
            padding: 18px;
            text-align: left;
        }

        th {
            font-size: 15px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        tbody tr {
            transition: 0.3s;
        }

        tbody tr:nth-child(even) {
            background-color: #fffbe6; /* Warna kuning sangat muda untuk baris genap */
        }

        tbody tr:hover {
            background-color: #fff3e0; /* Hover warna oranye susu */
            transform: scale(1.01);
        }

        /* Styling Link Gambar */
        .link-buku {
            color: #e65100; /* Oranye gelap agar kontras dan mudah dibaca */
            text-decoration: none;
            font-weight: bold;
            border-bottom: 2px solid transparent;
            transition: 0.3s;
        }

        .link-buku:hover {
            border-bottom: 2px solid #e65100;
            color: #ff6d00;
        }

        /* Badge Kategori */
        .category-badge {
            background: #ffe0b2;
            color: #ef6c00;
            padding: 6px 15px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
        }

        /* === STYLING UNTUK FORM PENAMBAHAN KOLEKSI === */
        .add-collection-section {
            background: linear-gradient(135deg, #fff3e0 0%, #ffe0b2 100%);
            padding: 25px;
            border-radius: 15px;
            border: 2px solid #ffb300;
            margin-top: 30px;
        }

        .add-collection-section h2 {
            color: #fb8c00;
            margin-top: 0;
            margin-bottom: 20px;
            text-align: center;
            font-size: 22px;
        }

        .form-group {
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
        }

        .form-group label {
            color: #e65100;
            font-weight: bold;
            margin-bottom: 8px;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .form-group input,
        .form-group select {
            padding: 12px 15px;
            font-size: 14px;
            border: 2px solid #ffb300;
            border-radius: 10px;
            outline: none;
            transition: 0.3s;
            background-color: #fffef5;
            color: #444;
        }

        .form-group input:focus,
        .form-group select:focus {
            border-color: #fb8c00;
            box-shadow: 0 0 8px rgba(251, 140, 0, 0.3);
            background-color: #fffdec;
        }

        .form-row {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        .form-row .form-group {
            flex: 1;
            min-width: 200px;
        }

        .button-group {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 20px;
        }

        .btn {
            padding: 12px 30px;
            font-size: 15px;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-add {
            background: linear-gradient(to right, #fb8c00, #ffb300);
            color: white;
            box-shadow: 0 5px 15px rgba(251, 140, 0, 0.3);
        }

        .btn-add:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(251, 140, 0, 0.4);
        }

        .btn-reset {
            background: #e0e0e0;
            color: #666;
        }

        .btn-reset:hover {
            background: #d0d0d0;
        }

        .btn:active {
            transform: translateY(0);
        }

        /* Pesan Notifikasi */
        .notification {
            padding: 15px 20px;
            border-radius: 10px;
            margin-bottom: 15px;
            display: none;
            text-align: center;
            font-weight: bold;
        }

        .notification.success {
            background-color: #c8e6c9;
            color: #2e7d32;
            display: block;
            border-left: 4px solid #2e7d32;
        }

        .notification.error {
            background-color: #ffcdd2;
            color: #c62828;
            display: block;
            border-left: 4px solid #c62828;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header-section">
        <h1>Selamat Datang di Ruang Baca Digital</h1>
        <p>"Membaca adalah petualangan yang dimulai dari hati."</p>
    </div>

    <div class="search-box">
        <input type="text" id="searchInput" onkeyup="filterTable()" placeholder="Cari koleksi buku favoritmu...">
    </div>

    <table id="bookTable">
        <thead>
            <tr>
                <th>No</th>
                <th>Judul Buku</th>
                <th>Penulis</th>
                <th>Tahun</th>
                <th>Kategori</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>1</td>
                <td><a href="jafar.jpg" target="_blank" class="link-buku">Tuhan Ada di Hatimu</a></td>
                <td>Habib Ja'far</td>
                <td>2020</td>
                <td><span class="category-badge">Agama</span></td>
            </tr>
            <tr>
                <td>2</td>
                <td><a href="hujan.jpg" target="_blank" class="link-buku">Hujan</a></td>
                <td>Tere Liye</td>
                <td>2016</td>
                <td><span class="category-badge">Novel</span></td>
            </tr>
            <tr>
                <td>3</td>
                <td><a href="pulang.jpg" target="_blank" class="link-buku">Pulang</a></td>
                <td>Tere Liye</td>
                <td>2015</td>
                <td><span class="category-badge">Novel</span></td>
            </tr>
        </tbody>
    </table>

    <!-- === BAGIAN PENAMBAHAN KOLEKSI BUKU === -->
    <div class="add-collection-section">
        <h2>➕ Tambah Koleksi Buku Baru</h2>
        
        <div id="notificationMessage" class="notification"></div>

        <form id="addBookForm">
            <div class="form-row">
                <div class="form-group">
                    <label for="bookTitle">Judul Buku *</label>
                    <input type="text" id="bookTitle" placeholder="Masukkan judul buku" required>
                </div>
                <div class="form-group">
                    <label for="bookAuthor">Penulis *</label>
                    <input type="text" id="bookAuthor" placeholder="Masukkan nama penulis" required>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="bookYear">Tahun Terbit *</label>
                    <input type="number" id="bookYear" min="1900" max="2100" placeholder="Contoh: 2024" required>
                </div>
                <div class="form-group">
                    <label for="bookCategory">Kategori *</label>
                    <select id="bookCategory" required>
                        <option value="">-- Pilih Kategori --</option>
                        <option value="Agama">Agama</option>
                        <option value="Novel">Novel</option>
                        <option value="Fiksi">Fiksi</option>
                        <option value="Non-Fiksi">Non-Fiksi</option>
                        <option value="Biografi">Biografi</option>
                        <option value="Teknologi">Teknologi</option>
                        <option value="Pendidikan">Pendidikan</option>
                        <option value="Seni">Seni</option>
                        <option value="Sejarah">Sejarah</option>
                        <option value="Lainnya">Lainnya</option>
                    </select>
                </div>
            </div>

            <div class="form-group">
                <label for="bookLink">Link Gambar / File (Opsional)</label>
                <input type="text" id="bookLink" placeholder="Contoh: nama-buku.jpg">
            </div>

            <div class="button-group">
                <button type="submit" class="btn btn-add">Tambah ke Koleksi</button>
                <button type="reset" class="btn btn-reset">Reset Form</button>
            </div>
        </form>
    </div>
</div>

<script>
function filterTable() {
    let input = document.getElementById("searchInput");
    let filter = input.value.toLowerCase();
    let table = document.getElementById("bookTable");
    let tr = table.getElementsByTagName("tr");

    for (let i = 1; i < tr.length; i++) {
        let tdTitle = tr[i].getElementsByTagName("td")[1];
        let tdAuthor = tr[i].getElementsByTagName("td")[2];
        if (tdTitle || tdAuthor) {
            let textValue = (tdTitle.textContent || tdTitle.innerText) + 
                            (tdAuthor.textContent || tdAuthor.innerText);
            if (textValue.toLowerCase().indexOf(filter) > -1) {
                tr[i].style.display = "";
            } else {
                tr[i].style.display = "none";
            }
        }
    }
}

// === FUNGSI UNTUK MENAMBAH BUKU BARU ===
document.getElementById("addBookForm").addEventListener("submit", function(e) {
    e.preventDefault();

    // Ambil data dari form
    let judul = document.getElementById("bookTitle").value.trim();
    let penulis = document.getElementById("bookAuthor").value.trim();
    let tahun = document.getElementById("bookYear").value.trim();
    let kategori = document.getElementById("bookCategory").value.trim();
    let link = document.getElementById("bookLink").value.trim();

    // Validasi input
    if (!judul || !penulis || !tahun || !kategori) {
        tampilNotifikasi("Harap isi semua field yang wajib (*)", "error");
        return;
    }

    // Ambil nomor baris berikutnya
    let table = document.getElementById("bookTable");
    let rowCount = table.getElementsByTagName("tbody")[0].getElementsByTagName("tr").length;
    let nomorBaru = rowCount + 1;

    // Buat baris tabel baru
    let newRow = table.getElementsByTagName("tbody")[0].insertRow();
    
    // Masukkan data ke dalam baris
    let cell1 = newRow.insertCell(0);
    let cell2 = newRow.insertCell(1);
    let cell3 = newRow.insertCell(2);
    let cell4 = newRow.insertCell(3);
    let cell5 = newRow.insertCell(4);

    cell1.textContent = nomorBaru;
    
    // Jika ada link, jadikan hyperlink, jika tidak langsung text
    if (link) {
        cell2.innerHTML = '<a href="' + link + '" target="_blank" class="link-buku">' + judul + '</a>';
    } else {
        cell2.textContent = judul;
    }
    
    cell3.textContent = penulis;
    cell4.textContent = tahun;
    cell5.innerHTML = '<span class="category-badge">' + kategori + '</span>';

    // Tampilkan pesan sukses
    tampilNotifikasi("✓ Buku '" + judul + "' berhasil ditambahkan ke koleksi!", "success");

    // Reset form
    document.getElementById("addBookForm").reset();

    // Clear notifikasi setelah 3 detik
    setTimeout(() => {
        document.getElementById("notificationMessage").style.display = "none";
    }, 3000);
});

// Fungsi untuk menampilkan notifikasi
function tampilNotifikasi(pesan, tipe) {
    let notif = document.getElementById("notificationMessage");
    notif.textContent = pesan;
    notif.className = "notification " + tipe;
    notif.style.display = "block";
}
</script>

</body>
</html>
